<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sustainable Suppliers Dashboard — Choose a New Password</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --ink: #14213D;
    --muted: #6B7385;
    --border: #DDE1E8;
    --error: #B3261E;
    --error-bg: #FBEAE9;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 40px 32px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
  }
  input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  button[type="submit"] {
    width: 100%;
    padding: 11px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #FFFFFF;
    background: var(--ink);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 8px;
  }
  button[type="submit"]:hover { background: #1c2c54; }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-banner {
    background: var(--error-bg);
    color: var(--error);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 18px;
  }
  .success-banner {
    background: #E4F5EA;
    color: #1E7A46;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 18px;
  }
  .error-banner[hidden], .success-banner[hidden], form[hidden], .back-link[hidden] { display: none; }
  .back-link { display: block; margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
  .back-link:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="card">
  <h1>Choose a new password</h1>
  <p class="subtitle" id="subtitle">Checking your reset link…</p>
  <div class="error-banner" id="error-banner" hidden></div>
  <div class="success-banner" id="success-banner" hidden></div>

  <form id="reset-form" novalidate hidden>
    <div class="field">
      <label for="new-password">New password</label>
      <input type="password" id="new-password" required autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm-password">Confirm new password</label>
      <input type="password" id="confirm-password" required autocomplete="new-password">
    </div>
    <button type="submit" id="submit-btn">Save new password</button>
  </form>

  <a class="back-link" href="index.html" id="back-link" hidden>Back to sign in</a>
</div>

<script>
(function () {
  'use strict';

  var MIN_LENGTH = 8;
  var sb = null;

  function showError(message) {
    var banner = document.getElementById('error-banner');
    banner.textContent = message;
    banner.hidden = false;
  }
  function hideError() {
    var banner = document.getElementById('error-banner');
    banner.hidden = true;
    banner.textContent = '';
  }

  async function ensureSupabase() {
    if (sb) return sb;
    var res = await fetch('/.netlify/functions/public-config');
    if (!res.ok) throw new Error('Could not reach the sign-in service.');
    var cfg = await res.json();
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    return sb;
  }

  function showInvalidLink() {
    document.getElementById('subtitle').textContent = 'This reset link is invalid or has expired. Request a new one from the sign-in page.';
    document.getElementById('reset-form').hidden = true;
    document.getElementById('back-link').hidden = false;
  }

  function showForm() {
    document.getElementById('subtitle').textContent = 'Enter and confirm the new password for your team account.';
    document.getElementById('reset-form').hidden = false;
  }

  async function init() {
    try {
      var client = await ensureSupabase();
      // The client parses the recovery tokens from the URL on creation; getSession waits for that to finish.
      var { data } = await client.auth.getSession();
      if (data && data.session) showForm();
      else showInvalidLink();
    } catch (err) {
      console.error(err);
      showInvalidLink();
    }
  }

  document.getElementById('reset-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    hideError();
    var newPassword = document.getElementById('new-password').value;
    var confirmPassword = document.getElementById('confirm-password').value;

    if (newPassword.length < MIN_LENGTH) {
      showError('Password must be at least ' + MIN_LENGTH + ' characters.');
      return;
    }
    if (newPassword !== confirmPassword) {
      showError('The two passwords do not match.');
      return;
    }

    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      var client = await ensureSupabase();
      var { error } = await client.auth.updateUser({ password: newPassword });
      if (error) throw new Error(error.message || 'Could not update the password.');
      document.getElementById('reset-form').hidden = true;
      document.getElementById('subtitle').textContent = '';
      var success = document.getElementById('success-banner');
      success.textContent = 'Password updated. Taking you to the dashboard…';
      success.hidden = false;
      setTimeout(function () { window.location.replace('dashboard.html'); }, 1500);
    } catch (err) {
      showError(err.message || 'Could not update the password. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Save new password';
    }
  });

  init();
})();
</script>
</body>
</html>
